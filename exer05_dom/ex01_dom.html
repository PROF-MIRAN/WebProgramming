
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>DOM 선택 실습</title>
    <script>
        window.onload = function() {

            // ① ID로 요소 1개 선택
            let title = document.getElementById('title');
            title.style.color = 'blue';

            // ② 선택자로 요소 1개 선택
            let subtitle = document.querySelector('h2');
            subtitle.innerHTML = 'JavaScript로 변경한 제목';

            // ③ 클래스명으로 여러 요소 선택
            let items = document.getElementsByClassName('item');
            for (let i = 0; i < items.length; i++) {
                items[i].style.color = 'red';
            }

            // ④ name으로 여러 요소 선택
            let messages = document.getElementsByName('message');
            for (let i = 0; i < messages.length; i++) {
                messages[i].style.backgroundColor = 'yellow';
            }

            // ⑤ 선택자로 여러 요소 선택
            let paragraphs = document.querySelectorAll('p');
            for (let i = 0; i < paragraphs.length; i++) {
                paragraphs[i].style.fontWeight = 'bold';
            }
        };
    </script>
</head>
<body>
    <h1 id="title">DOM 선택 실습</h1>
    <h2>기존 제목</h2>

    <p class="item">첫 번째 항목</p>
    <p class="item">두 번째 항목</p>
    <p class="item">세 번째 항목</p>

    <p name="message">안녕하세요!</p>
    <p name="message">JavaScript 실습입니다.</p>
</body>
</html>

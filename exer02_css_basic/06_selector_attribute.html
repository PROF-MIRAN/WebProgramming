<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>속성 선택자 예제</title>

    <style>
        input[type="text"]{
            background-color: lightblue;
        }

        input[type="password"]{
            background-color: lightpink;
        }

        label{
            display: inline-block;
            width: 80px;
        }
    </style>
</head>

<body>

    <h2>회원가입</h2>

    <label>이름:</label>
    <input type="text" placeholder="이름을 입력하세요"> <br>
    <label>비밀번호:</label>
    <input type="password" placeholder="비밀번호를 입력하세요">

    <br><br>

    <input type="submit" value="가입하기">

</body>
</html>
